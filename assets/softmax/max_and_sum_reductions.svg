<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Worked maximum and sum reductions</title>
  <desc id="desc">A four-lane reduction finds the maximum of local maxima six, four, five, and one. Local denominators are corrected to maximum six and then reduced by addition to approximately 1.5873.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#0f766e"/></marker>
    <style>.h{font:700 31px system-ui,sans-serif;fill:#102a43}.sect{font:700 23px system-ui,sans-serif;fill:#102a43}.sub{font:400 16px system-ui,sans-serif;fill:#52606d}.lane{font:700 16px system-ui,sans-serif;fill:#486581;text-anchor:middle}.v{font:700 21px ui-monospace,monospace;fill:#102a43;text-anchor:middle}.eq{font:500 17px ui-monospace,monospace;fill:#102a43}.good{font:700 19px system-ui,sans-serif;fill:#047857}</style>
  </defs>
  <rect width="1400" height="940" fill="#fbfdff"/>
  <text x="70" y="58" class="h">Two reductions turn four local summaries into one row summary</text>

  <text x="70" y="118" class="sect">1. Reduce the local maxima</text>
  <g class="lane"><text x="360" y="158">lane 0</text><text x="580" y="158">lane 1</text><text x="800" y="158">lane 2</text><text x="1020" y="158">lane 3</text></g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="300" y="176" width="120" height="62" rx="12"/><rect x="520" y="176" width="120" height="62" rx="12"/><rect x="740" y="176" width="120" height="62" rx="12"/><rect x="960" y="176" width="120" height="62" rx="12"/></g>
  <g class="v"><text x="360" y="216">6</text><text x="580" y="216">4</text><text x="800" y="216">5</text><text x="1020" y="216">1</text></g>
  <text x="95" y="298" class="sub">offset 2</text><path d="M800 244C760 280 440 280 390 244" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 244C980 315 650 315 600 244" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="2"><rect x="410" y="330" width="120" height="62" rx="12"/><rect x="630" y="330" width="120" height="62" rx="12"/></g><g class="v"><text x="470" y="370">max=6</text><text x="690" y="370">max=4</text></g>
  <text x="95" y="418" class="sub">offset 1</text><path d="M690 398C660 445 530 445 500 398" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="520" y="452" width="190" height="66" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="615" y="493" class="v">row max = 6</text>

  <text x="70" y="580" class="sect">2. Correct every local denominator to the row maximum</text>
  <text x="100" y="628" class="eq">thread 0: 1.0498 × e^(6−6) = 1.0498</text>
  <text x="100" y="666" class="eq">thread 1: 1.0498 × e^(4−6) = 0.1421</text>
  <text x="730" y="628" class="eq">thread 2: 1.0498 × e^(5−6) = 0.3862</text>
  <text x="730" y="666" class="eq">thread 3: 1.3679 × e^(1−6) = 0.0092</text>

  <text x="70" y="738" class="sect">3. Reduce the corrected values by addition</text>
  <g fill="#fef3c7" stroke="#d97706" stroke-width="2"><rect x="220" y="770" width="190" height="60" rx="12"/><rect x="480" y="770" width="190" height="60" rx="12"/><rect x="740" y="770" width="190" height="60" rx="12"/><rect x="1000" y="770" width="190" height="60" rx="12"/></g>
  <g class="v"><text x="315" y="808">1.0498</text><text x="575" y="808">0.1421</text><text x="835" y="808">0.3862</text><text x="1095" y="808">0.0092</text></g>
  <path d="M835 838C790 870 410 870 360 838" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1095 838C1050 900 670 900 620 838" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="700" y="912" class="good" text-anchor="middle">(1.0498 + 0.3862) + (0.1421 + 0.0092) = 1.5873</text>
</svg>
