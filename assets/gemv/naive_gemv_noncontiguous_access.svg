<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Non-contiguous memory access in the naive GEMV kernel</title>
  <desc id="desc">At column zero, neighboring threads access the first element of different matrix rows. In row-major linear memory these addresses are zero, N, two N, and three N, so they are separated by an entire row.</desc>
  <defs>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#dc2626"/></marker>
    <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#475569"/></marker>
    <style>.h{font:700 30px system-ui,sans-serif;fill:#102a43}.l{font:700 20px system-ui,sans-serif;fill:#102a43}.s{font:400 16px system-ui,sans-serif;fill:#52606d}.c{font:600 16px system-ui,sans-serif;fill:#102a43;text-anchor:middle}.i{font:500 14px system-ui,sans-serif;fill:#486581;text-anchor:middle}.bad{font:700 19px system-ui,sans-serif;fill:#b91c1c;text-anchor:middle}.mono{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#102a43;text-anchor:middle}</style>
  </defs>
  <rect width="1400" height="900" fill="#fbfdff"/>
  <text x="70" y="58" class="h">Freeze the first warp at column = 0</text>
  <text x="70" y="89" class="s">Each thread owns a different row, so the warp reaches down the first column of A during the same load instruction.</text>

  <text x="385" y="145" class="l" text-anchor="middle">Logical matrix A</text>
  <g class="i"><text x="275" y="183">column 0</text><text x="405" y="183">column 1</text><text x="535" y="183">…</text><text x="665" y="183">column N−1</text></g>
  <g class="i" text-anchor="end"><text x="195" y="242">row 0</text><text x="195" y="322">row 1</text><text x="195" y="402">row 2</text><text x="195" y="482">row 3</text><text x="195" y="537">⋮</text><text x="195" y="592">row 31</text></g>
  <g stroke-width="1.7"><g fill="#fecaca" stroke="#dc2626"><rect x="210" y="195" width="130" height="80"/><rect x="210" y="275" width="130" height="80"/><rect x="210" y="355" width="130" height="80"/><rect x="210" y="435" width="130" height="80"/><rect x="210" y="545" width="130" height="80"/></g><g fill="#f1f5f9" stroke="#64748b"><rect x="340" y="195" width="130" height="80"/><rect x="470" y="195" width="130" height="80"/><rect x="600" y="195" width="130" height="80"/><rect x="340" y="275" width="130" height="80"/><rect x="470" y="275" width="130" height="80"/><rect x="600" y="275" width="130" height="80"/><rect x="340" y="355" width="130" height="80"/><rect x="470" y="355" width="130" height="80"/><rect x="600" y="355" width="130" height="80"/><rect x="340" y="435" width="130" height="80"/><rect x="470" y="435" width="130" height="80"/><rect x="600" y="435" width="130" height="80"/><rect x="340" y="545" width="130" height="80"/><rect x="470" y="545" width="130" height="80"/><rect x="600" y="545" width="130" height="80"/></g></g>
  <g class="c"><text x="275" y="242" fill="#991b1b">A[0,0]</text><text x="405" y="242">A[0,1]</text><text x="535" y="242">…</text><text x="665" y="242">A[0,N−1]</text><text x="275" y="322" fill="#991b1b">A[1,0]</text><text x="405" y="322">A[1,1]</text><text x="535" y="322">…</text><text x="665" y="322">A[1,N−1]</text><text x="275" y="402" fill="#991b1b">A[2,0]</text><text x="405" y="402">A[2,1]</text><text x="535" y="402">…</text><text x="665" y="402">A[2,N−1]</text><text x="275" y="482" fill="#991b1b">A[3,0]</text><text x="405" y="482">A[3,1]</text><text x="535" y="482">…</text><text x="665" y="482">A[3,N−1]</text><text x="275" y="592" fill="#991b1b">A[31,0]</text><text x="405" y="592">A[31,1]</text><text x="535" y="592">…</text><text x="665" y="592">A[31,N−1]</text></g>

  <text x="1015" y="145" class="l" text-anchor="middle">Threads in warp 0</text>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"><rect x="820" y="205" width="105" height="58" rx="8"/><rect x="955" y="285" width="105" height="58" rx="8"/><rect x="1090" y="365" width="105" height="58" rx="8"/><rect x="1225" y="445" width="105" height="58" rx="8"/><rect x="1225" y="555" width="105" height="58" rx="8"/></g>
  <g class="c"><text x="872" y="241">thread 0</text><text x="1007" y="321">thread 1</text><text x="1142" y="401">thread 2</text><text x="1277" y="481">thread 3</text><text x="1277" y="591">thread 31</text></g>
  <path d="M820 234C650 234 530 235 350 235" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#red-arrow)"/><path d="M955 314C720 314 550 315 350 315" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#red-arrow)"/><path d="M1090 394C770 394 590 395 350 395" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#red-arrow)"/><path d="M1225 474C820 474 610 475 350 475" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#red-arrow)"/><path d="M1225 584C820 584 610 585 350 585" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#red-arrow)"/>

  <text x="70" y="690" class="l">The same addresses in row-major linear memory</text>
  <g stroke-width="1.6"><g fill="#fecaca" stroke="#dc2626"><rect x="70" y="715" width="105" height="72"/><rect x="365" y="715" width="105" height="72"/><rect x="660" y="715" width="105" height="72"/><rect x="955" y="715" width="105" height="72"/><rect x="1225" y="715" width="105" height="72"/></g><g fill="#f1f5f9" stroke="#94a3b8"><rect x="175" y="715" width="190" height="72"/><rect x="470" y="715" width="190" height="72"/><rect x="765" y="715" width="190" height="72"/><rect x="1060" y="715" width="165" height="72"/></g></g>
  <g class="c"><text x="122" y="750" fill="#991b1b">A[0,0]</text><text x="417" y="750" fill="#991b1b">A[1,0]</text><text x="712" y="750" fill="#991b1b">A[2,0]</text><text x="1007" y="750" fill="#991b1b">A[3,0]</text><text x="1277" y="750" fill="#991b1b">A[31,0]</text></g>
  <g class="i"><text x="122" y="776">index 0</text><text x="270" y="758">N−1 values</text><text x="417" y="776">index N</text><text x="565" y="758">N−1 values</text><text x="712" y="776">index 2N</text><text x="860" y="758">N−1 values</text><text x="1007" y="776">index 3N</text><text x="1142" y="758">…</text><text x="1277" y="776">index 31N</text></g>
  <path d="M122 805H417M417 805H712M712 805H1007" stroke="#dc2626" stroke-width="2" marker-end="url(#red-arrow)"/>
  <g class="bad"><text x="270" y="838">stride = N</text><text x="565" y="838">stride = N</text><text x="860" y="838">stride = N</text></g>
  <rect x="430" y="855" width="540" height="38" rx="9" fill="#fee2e2" stroke="#f87171"/><text x="700" y="881" class="bad">For large N: up to 32 separate memory transactions</text>
</svg>
