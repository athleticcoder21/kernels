<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Naive GEMV: one independent dot product per row</title>
  <desc id="desc">Three threads traverse separate contiguous rows of flattened A, use the shared vector x, and write separate values of y.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#475569"/></marker>
    <style>.h{font:700 31px system-ui,sans-serif;fill:#102a43}.l{font:700 20px system-ui,sans-serif;fill:#102a43}.s{font:400 17px system-ui,sans-serif;fill:#52606d}.c{font:600 15px system-ui,sans-serif;fill:#102a43;text-anchor:middle}.i{font:500 14px system-ui,sans-serif;fill:#334e68;text-anchor:middle}.m{font:italic 20px Georgia,serif;fill:#102a43;text-anchor:middle}</style>
  </defs>
  <rect width="1440" height="860" fill="#fbfdff"/>
  <text x="70" y="60" class="h">Naïve GEMV: one independent dot product per row</text>
  <text x="70" y="92" class="s">A 3 × 6 example: A is stored row-major as one linear array, not as three separate rows.</text>
  <text x="70" y="150" class="l">Flattened matrix A in global memory</text>
  <text x="70" y="178" class="s">A[i, j] is stored at linear offset iN + j</text>

  <g class="l" text-anchor="middle">
    <rect x="70" y="221" width="150" height="50" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="145" y="253">thread 0</text>
    <rect x="70" y="297" width="150" height="50" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="145" y="329">thread 1</text>
    <rect x="70" y="373" width="150" height="50" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="145" y="405">thread 2</text>
  </g>
  <path d="M220 246H290M220 322H290M220 398H290" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <g stroke-width="1.5">
    <g fill="#e0f2fe" stroke="#075985"><rect x="300" y="210" width="110" height="72"/><rect x="410" y="210" width="110" height="72"/><rect x="520" y="210" width="110" height="72"/><rect x="630" y="210" width="110" height="72"/><rect x="740" y="210" width="110" height="72"/><rect x="850" y="210" width="110" height="72"/></g>
    <g fill="#dcfce7" stroke="#15803d"><rect x="300" y="286" width="110" height="72"/><rect x="410" y="286" width="110" height="72"/><rect x="520" y="286" width="110" height="72"/><rect x="630" y="286" width="110" height="72"/><rect x="740" y="286" width="110" height="72"/><rect x="850" y="286" width="110" height="72"/></g>
    <g fill="#ffedd5" stroke="#c2410c"><rect x="300" y="362" width="110" height="72"/><rect x="410" y="362" width="110" height="72"/><rect x="520" y="362" width="110" height="72"/><rect x="630" y="362" width="110" height="72"/><rect x="740" y="362" width="110" height="72"/><rect x="850" y="362" width="110" height="72"/></g>
  </g>
  <g class="c"><text x="355" y="253">A[0,0]</text><text x="465" y="253">A[0,1]</text><text x="575" y="253">A[0,2]</text><text x="685" y="253">A[0,3]</text><text x="795" y="253">A[0,4]</text><text x="905" y="253">A[0,5]</text><text x="355" y="329">A[1,0]</text><text x="465" y="329">A[1,1]</text><text x="575" y="329">A[1,2]</text><text x="685" y="329">A[1,3]</text><text x="795" y="329">A[1,4]</text><text x="905" y="329">A[1,5]</text><text x="355" y="405">A[2,0]</text><text x="465" y="405">A[2,1]</text><text x="575" y="405">A[2,2]</text><text x="685" y="405">A[2,3]</text><text x="795" y="405">A[2,4]</text><text x="905" y="405">A[2,5]</text></g>
  <g class="i"><text x="355" y="277">0</text><text x="905" y="277">N−1</text><text x="355" y="353">N</text><text x="905" y="353">2N−1</text><text x="355" y="429">2N</text><text x="905" y="429">3N−1</text></g>
  <path d="M300 462H960" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="630" y="493" class="s" text-anchor="middle">each thread advances through N adjacent values: A[i,0] → A[i,1] → … → A[i,N−1]</text>

  <text x="70" y="565" class="l">Shared input vector x in global memory</text><text x="70" y="592" class="s">Every thread reads the same sequence x[0], x[1], …, x[N−1]</text>
  <g fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"><rect x="300" y="530" width="110" height="72"/><rect x="410" y="530" width="110" height="72"/><rect x="520" y="530" width="110" height="72"/><rect x="630" y="530" width="110" height="72"/><rect x="740" y="530" width="110" height="72"/><rect x="850" y="530" width="110" height="72"/></g>
  <g class="c"><text x="355" y="573">x[0]</text><text x="465" y="573">x[1]</text><text x="575" y="573">x[2]</text><text x="685" y="573">x[3]</text><text x="795" y="573">x[4]</text><text x="905" y="573">x[N−1]</text></g>

  <text x="1050" y="150" class="l">Independent reductions</text>
  <g fill="#f0fdfa" stroke="#0f766e" stroke-width="2"><rect x="1050" y="210" width="260" height="72" rx="12"/><rect x="1050" y="286" width="260" height="72" rx="12"/><rect x="1050" y="362" width="260" height="72" rx="12"/></g>
  <g><text x="1180" y="243" class="m">Σ A[0,j] · x[j]</text><text x="1180" y="271" class="i">writes y[0]</text><text x="1180" y="319" class="m">Σ A[1,j] · x[j]</text><text x="1180" y="347" class="i">writes y[1]</text><text x="1180" y="395" class="m">Σ A[2,j] · x[j]</text><text x="1180" y="423" class="i">writes y[2]</text></g>
  <path d="M960 246H1040M960 322H1040M960 398H1040" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1035 565C1005 565 1005 246 1040 246M1035 565C1000 565 1000 322 1040 322M1035 565C995 565 995 398 1040 398" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1160" y="536" class="i">same x for every row</text>

  <text x="70" y="690" class="l">Output vector y in global memory</text><g fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"><rect x="300" y="650" width="150" height="72"/><rect x="450" y="650" width="150" height="72"/><rect x="600" y="650" width="150" height="72"/></g><g class="c"><text x="375" y="694">y[0]</text><text x="525" y="694">y[1]</text><text x="675" y="694">y[2]</text></g><path d="M1180 434V620H675V640" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800" y="680" class="s">one scalar written by each thread</text>
  <rect x="70" y="785" width="1270" height="50" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="100" y="817" class="i" text-anchor="start">Mental model: row i occupies the contiguous range A[iN : (i+1)N); reducing it against x produces exactly one output element y[i].</text>
</svg>
