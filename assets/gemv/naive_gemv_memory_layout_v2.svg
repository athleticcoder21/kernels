<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapping a two-dimensional matrix to row-major linear memory</title>
  <desc id="desc">A three by four matrix is flattened into one row of twelve memory locations. A at row two column two maps to linear index ten.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5 0 10z" fill="#334e68"/></marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5 0 10z" fill="#c2410c"/></marker>
    <style>.h{font:700 31px system-ui,sans-serif;fill:#102a43}.l{font:700 21px system-ui,sans-serif;fill:#102a43}.s{font:400 17px system-ui,sans-serif;fill:#52606d}.c{font:600 17px system-ui,sans-serif;fill:#102a43;text-anchor:middle}.i{font:500 14px system-ui,sans-serif;fill:#52606d;text-anchor:middle}.r{font:600 15px system-ui,sans-serif;fill:#486581;text-anchor:end}.eq{font:700 23px system-ui,sans-serif;fill:#9a3412;text-anchor:middle}</style>
  </defs>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="70" y="60" class="h">How a 2D matrix becomes a linear array</text>
  <text x="70" y="92" class="s">Example: A has M = 3 rows and N = 4 columns. CUDA stores its elements row by row.</text>

  <text x="365" y="148" class="l" text-anchor="middle">Logical matrix A</text>
  <text x="217" y="196" class="i">column</text>
  <g class="i"><text x="282" y="196">0</text><text x="372" y="196">1</text><text x="462" y="196">2</text><text x="552" y="196">3</text></g>
  <g class="r"><text x="217" y="262">row 0</text><text x="217" y="352">row 1</text><text x="217" y="442">row 2</text></g>
  <g stroke-width="1.8">
    <g fill="#dbeafe" stroke="#2563eb"><rect x="237" y="207" width="90" height="90"/><rect x="327" y="207" width="90" height="90"/><rect x="417" y="207" width="90" height="90"/><rect x="507" y="207" width="90" height="90"/></g>
    <g fill="#dcfce7" stroke="#16a34a"><rect x="237" y="297" width="90" height="90"/><rect x="327" y="297" width="90" height="90"/><rect x="417" y="297" width="90" height="90"/><rect x="507" y="297" width="90" height="90"/></g>
    <g fill="#ffedd5" stroke="#ea580c"><rect x="237" y="387" width="90" height="90"/><rect x="327" y="387" width="90" height="90"/><rect x="417" y="387" width="90" height="90" fill="#fdba74" stroke="#c2410c" stroke-width="4"/><rect x="507" y="387" width="90" height="90"/></g>
  </g>
  <g class="c"><text x="282" y="258">A[0,0]</text><text x="372" y="258">A[0,1]</text><text x="462" y="258">A[0,2]</text><text x="552" y="258">A[0,3]</text><text x="282" y="348">A[1,0]</text><text x="372" y="348">A[1,1]</text><text x="462" y="348">A[1,2]</text><text x="552" y="348">A[1,3]</text><text x="282" y="438">A[2,0]</text><text x="372" y="438">A[2,1]</text><text x="462" y="438" fill="#7c2d12">A[2,2]</text><text x="552" y="438">A[2,3]</text></g>

  <rect x="730" y="177" width="540" height="270" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="1000" y="220" class="l" text-anchor="middle">Example: locate A[2,2]</text>
  <text x="1000" y="264" class="s" text-anchor="middle">row = 2, column = 2, N = 4</text>
  <text x="1000" y="315" class="eq">offset = row × N + column</text>
  <text x="1000" y="360" class="eq">= 2 × 4 + 2 = 10</text>
  <text x="1000" y="410" class="l" text-anchor="middle">A[2,2] is therefore A[10]</text>
  <path d="M507 432C625 432 650 312 718 312" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#orange-arrow)"/>

  <text x="70" y="548" class="l">Linear storage of A in memory (row-major)</text>
  <text x="70" y="577" class="s">One contiguous row of memory; the number below each cell is its linear index.</text>
  <g stroke-width="1.6">
    <g fill="#dbeafe" stroke="#2563eb"><rect x="70" y="600" width="105" height="88"/><rect x="175" y="600" width="105" height="88"/><rect x="280" y="600" width="105" height="88"/><rect x="385" y="600" width="105" height="88"/></g>
    <g fill="#dcfce7" stroke="#16a34a"><rect x="490" y="600" width="105" height="88"/><rect x="595" y="600" width="105" height="88"/><rect x="700" y="600" width="105" height="88"/><rect x="805" y="600" width="105" height="88"/></g>
    <g fill="#ffedd5" stroke="#ea580c"><rect x="910" y="600" width="105" height="88"/><rect x="1015" y="600" width="105" height="88"/><rect x="1120" y="600" width="105" height="88" fill="#fdba74" stroke="#c2410c" stroke-width="4"/><rect x="1225" y="600" width="105" height="88"/></g>
  </g>
  <g class="c"><text x="122.5" y="638">A[0,0]</text><text x="227.5" y="638">A[0,1]</text><text x="332.5" y="638">A[0,2]</text><text x="437.5" y="638">A[0,3]</text><text x="542.5" y="638">A[1,0]</text><text x="647.5" y="638">A[1,1]</text><text x="752.5" y="638">A[1,2]</text><text x="857.5" y="638">A[1,3]</text><text x="962.5" y="638">A[2,0]</text><text x="1067.5" y="638">A[2,1]</text><text x="1172.5" y="638" fill="#7c2d12">A[2,2]</text><text x="1277.5" y="638">A[2,3]</text></g>
  <g class="i"><text x="122.5" y="674">0</text><text x="227.5" y="674">1</text><text x="332.5" y="674">2</text><text x="437.5" y="674">3</text><text x="542.5" y="674">4</text><text x="647.5" y="674">5</text><text x="752.5" y="674">6</text><text x="857.5" y="674">7</text><text x="962.5" y="674">8</text><text x="1067.5" y="674">9</text><text x="1172.5" y="674" fill="#9a3412">10</text><text x="1277.5" y="674">11</text></g>
  <path d="M1000 447C1000 515 1172 515 1172 588" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <text x="700" y="730" class="s" text-anchor="middle">A[row, column] → A[row × N + column]</text>
</svg>
